name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: aiinfra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:dev@localhost:5432/aiinfra_test
      REDIS_URL: redis://localhost:6379/0
      API_SECRET_TOKEN: ci-test-token
      IMAGE_GEN_MOCK: "true"
      TRANSCRIPTION_MOCK: "true"
      NOTIFICATIONS_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run Alembic migrations
        run: python -m alembic upgrade head
        env:
          PYTHONPATH: src

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: src
