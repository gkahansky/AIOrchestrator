[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# ── web service ────────────────────────────────────────────────────────────────
# Railway selects this section for the "web" service.
# Runs Alembic migrations before starting Uvicorn so schema is always current.
[deploy]
startCommand = "sh -c 'if [ \"$SERVICE_ROLE\" = \"worker\" ]; then exec celery -A aiplatform.worker worker --loglevel=info --concurrency=2; else python -m alembic upgrade head && exec uvicorn aiplatform.webapp.main:app --host 0.0.0.0 --port ${PORT:-8000}; fi'"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ── worker service ─────────────────────────────────────────────────────────────
# The worker service uses railway.worker.toml as its config file.
# In Railway dashboard → worker service → Settings → Config File Path:
#   set to: railway.worker.toml
