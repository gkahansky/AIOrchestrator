[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# ── web service ───────────────────────────────────────────────────────────────
[deploy]
startCommand = "sh -c 'python -m alembic upgrade head && uvicorn aiplatform.webapp.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
